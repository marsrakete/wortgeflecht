<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stammbaum · Wortgeflecht</title>
  <link rel="icon" href="./assets/wortgeflecht-favicon.svg">
  <link rel="stylesheet" href="./styles/stammbaum.css">
  <script type="importmap">
    {"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}
  </script>
  <script type="module" src="./stammbaum/main.js"></script>
</head>
<body>
  <main>
    <header>
      <a href="./index.html">Wortgeflecht</a>
      <h1>Stammbaum <small id="app-version" hidden></small></h1>
      <p>Erkunde die Verbindungen deiner Familie.</p>
    </header>
    <div class="layout">
      <aside>
        <div class="sidebar-head">
          <label for="gedcom">GEDCOM-Datei</label>
          <button id="search" type="button" aria-label="Person suchen" title="Person suchen"
            aria-haspopup="dialog" aria-controls="picker" disabled>
            <span class="search-icon" aria-hidden="true"></span>
          </button>
        </div>
        <input id="gedcom" type="file" accept=".ged,.gedcom">
        <p class="muted">Die Datei bleibt in diesem Browser.</p>
        <p id="status" role="status">Lade gespeicherten Stammbaum …</p>
        <div id="tools" hidden>
          <div class="actions">
            <button id="remove">Import löschen</button>
          </div>
          <fieldset id="generations" hidden>
            <legend>Generationen je Richtung</legend>
            <div class="actions">
              <button type="button" value="1" aria-pressed="true">1</button>
              <button type="button" value="2" aria-pressed="false">2</button>
              <button type="button" value="3" aria-pressed="false">3</button>
              <button type="button" value="4" aria-pressed="false">4</button>
              <button type="button" value="all" aria-pressed="false">Alle</button>
            </div>
          </fieldset>
          <button id="dates" type="button" aria-pressed="false" hidden>Lebensdaten</button>
          <nav class="path" aria-label="Erkundungspfad">
            <h2>Erkundungspfad</h2>
            <ol id="person-path"></ol>
          </nav>
          <section id="person" aria-label="Person und Verwandte"></section>
        </div>
      </aside>
      <section class="board" aria-label="Stammbaum-Ansicht">
        <div id="view"></div>
        <p id="hint">Wähle eine GEDCOM-Datei, um den Stammbaum zu öffnen.</p>
      </section>
    </div>
  </main>

  <dialog id="picker" aria-labelledby="picker-title">
    <h2 id="picker-title">Person suchen</h2>
    <label for="query">Vor- oder Nachname</label>
    <input id="query" type="search" autocomplete="off" autofocus>
    <ul id="results" aria-label="Suchergebnisse"></ul>
    <p id="result-status" role="status"></p>
    <div class="actions">
      <button id="start" class="primary">Oben anfangen</button>
      <button id="close">Schließen</button>
    </div>
  </dialog>
</body>
</html>
