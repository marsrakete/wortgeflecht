<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pageTitle"></title>
  <link rel="icon" href="./assets/wortgeflecht-favicon.svg">
  <link rel="stylesheet" href="./styles/stammbaum.css">
  <script type="importmap">
    {"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}
  </script>
  <script type="module" src="./stammbaum/main.js"></script>
</head>
<body>
  <main>
    <header>
      <a href="./index.html" data-i18n="appName"></a>
      <h1><span data-i18n="treeTitle"></span> <small id="app-version" hidden></small></h1>
      <p data-i18n="introduction"></p>
    </header>
    <div class="layout">
      <aside>
        <div class="sidebar-head">
          <label for="gedcom" data-i18n="fileLabel"></label>
          <button id="search" type="button" data-i18n-label="search" data-i18n-title="search"
            aria-haspopup="dialog" aria-controls="picker" disabled>
            <span class="search-icon" aria-hidden="true"></span>
          </button>
        </div>
        <input id="gedcom" type="file" accept=".ged,.gedcom">
        <p class="muted" data-i18n="filePrivacy"></p>
        <p id="status" role="status" data-i18n="loading"></p>
        <div id="tools" hidden>
          <div class="actions">
            <button id="timeline-open" type="button" data-i18n="timeline"></button>
            <button id="remove" data-i18n="deleteImport"></button>
          </div>
          <fieldset id="generations" hidden>
            <legend data-i18n="generations"></legend>
            <div class="actions">
              <button type="button" value="1" aria-pressed="true">1</button>
              <button type="button" value="2" aria-pressed="false">2</button>
              <button type="button" value="3" aria-pressed="false">3</button>
              <button type="button" value="4" aria-pressed="false">4</button>
              <button type="button" value="all" aria-pressed="false" data-i18n="all"></button>
            </div>
          </fieldset>
          <button id="dates" type="button" aria-pressed="false" hidden data-i18n="lifeDates"></button>
          <nav class="path" data-i18n-label="path">
            <h2 data-i18n="path"></h2>
            <ol id="person-path"></ol>
          </nav>
          <section id="person" data-i18n-label="personAndRelatives"></section>
        </div>
      </aside>
      <section class="board" data-i18n-label="treeView">
        <div id="view"></div>
        <p id="hint" data-i18n="chooseFile"></p>
      </section>
    </div>
  </main>

  <dialog id="picker" aria-labelledby="picker-title">
    <h2 id="picker-title" data-i18n="search"></h2>
    <label for="query" data-i18n="searchName"></label>
    <input id="query" type="search" autocomplete="off" autofocus>
    <ul id="results" data-i18n-label="searchResults"></ul>
    <p id="result-status" role="status"></p>
    <div class="actions">
      <button id="start" class="primary" data-i18n="start"></button>
      <button id="close" data-i18n="close"></button>
    </div>
  </dialog>
  <dialog id="timeline" aria-labelledby="timeline-title">
    <div class="timeline-header">
      <h2 id="timeline-title" data-i18n="timeline"></h2>
      <button id="timeline-close" type="button" data-i18n="close"></button>
    </div>
    <div class="timeline-controls">
      <div class="actions">
        <button type="button" data-timeline-mode="lives" aria-pressed="true" data-i18n="timelineLives"></button>
        <button type="button" data-timeline-mode="events" aria-pressed="false" data-i18n="timelineEvents"></button>
      </div>
      <div class="timeline-navigation">
        <button id="timeline-previous" type="button" data-i18n="timelineEarlier"></button>
        <output for="timeline-years" aria-live="polite"></output>
        <button id="timeline-next" type="button" data-i18n="timelineLater"></button>
      </div>
      <input id="timeline-years" type="range" data-i18n-label="timelineRange">
      <p class="muted" data-i18n="timelineHelp"></p>
    </div>
    <div class="timeline-window">
      <div class="timeline-axis" aria-hidden="true"></div>
      <ol class="timeline-list"></ol>
      <p class="timeline-empty" role="status" hidden></p>
    </div>
  </dialog>
</body>
</html>
